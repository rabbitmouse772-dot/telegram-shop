<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Магазин</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0; padding: 20px; text-align: center;
        }
        .product-card {
            border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f9f9f9);
        }
        .select-btn {
            background-color: var(--tg-theme-button-color, #248bcf);
            color: var(--tg-theme-button-text-color, #fff);
            border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Наш Магазин 🛍</h2>
    
    <div class="product-card">
        <h3>Товар 1: Крутая футболка</h3>
        <p>Цена: 1500 руб.</p>
        <button class="select-btn" onclick="selectItem('Крутая футболка', 1500)">Выбрать</button>
    </div>

    <div class="product-card">
        <h3>Товар 2: Стильная кепка</h3>
        <p>Цена: 800 руб.</p>
        <button class="select-btn" onclick="selectItem('Стильная кепка', 800)">Выбрать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentOrder = null;

        function selectItem(name, price) {
            // Сохраняем выбранный товар
            currentOrder = { product: name, price: price };
            
            // Настраиваем Главную Кнопку Telegram внизу экрана
            tg.MainButton.text = `Оформить заказ: ${name} (${price} руб.)`;
            tg.MainButton.textColor = "#FFFFFF";
            tg.MainButton.color = "#2ec761"; // Зеленый цвет кнопки оформления
            tg.MainButton.show(); // Показываем её пользователю
        }

        # Касание по Главной Кнопке Telegram отправляет данные
        tg.onEvent('mainButtonClicked', function() {
            if (currentOrder) {
                tg.sendData(JSON.stringify(currentOrder));
            }
        });
    </script>
</body>
</html>
