<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой магазин</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #fff;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        button {
            background: #248bcf;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Мой магазин 🛍</h2>

    <div class="card">
        <h3>Крутая футболка</h3>
        <p>Цена: 1500 руб.</p>
        <button onclick="orderItem('Крутая футболка', 1500)">
            Купить товар
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        function orderItem(name, price) {
            const order = {
                product: name,
                price: price
            };

            tg.sendData(JSON.stringify(order));
        }
    </script>

</body>
</html>
